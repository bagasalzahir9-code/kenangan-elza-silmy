<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Elza ♥ Silmy
    </title>


    <style>
        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #12050b;
            font-family: Georgia, "Times New Roman", serif;
        }



        /* =====================================================
           WEBSITE FRAME
        ===================================================== */

        #websiteFrame {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            border: none;

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 1.1s ease,
                visibility 1.1s ease;
        }


        body.unlocked #websiteFrame {
            opacity: 1;
            visibility: visible;
        }



        /* =====================================================
           PASSWORD SCREEN
        ===================================================== */

        .lock-screen {
            position: fixed;
            inset: 0;
            z-index: 99999;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            overflow: hidden;

            background:
                radial-gradient(circle at 50% 35%,
                    rgba(125, 27, 61, 0.35),
                    transparent 38%),
                radial-gradient(circle at 10% 90%,
                    rgba(100, 15, 45, 0.24),
                    transparent 35%),
                linear-gradient(145deg,
                    #090205,
                    #180710 48%,
                    #0b0206);

            transition:
                opacity 1s ease,
                visibility 1s ease,
                transform 1s ease;
        }


        body.unlocked .lock-screen {
            opacity: 0;
            visibility: hidden;
            transform: scale(1.05);
            pointer-events: none;
        }



        /* =====================================================
           BACKGROUND DECORATION
        ===================================================== */

        .lock-screen::before {
            content: "";

            position: absolute;
            inset: -40%;

            background:
                radial-gradient(circle,
                    rgba(255, 166, 187, 0.08) 0 1px,
                    transparent 2px);

            background-size: 45px 45px;

            animation: starsMove 18s linear infinite;
        }


        @keyframes starsMove {

            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(90px);
            }

        }



        .lock-glow {
            position: absolute;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background: rgba(154, 29, 73, 0.15);

            filter: blur(90px);

            animation: glowPulse 4s ease-in-out infinite;
        }


        @keyframes glowPulse {

            0%,
            100% {
                transform: scale(0.9);
                opacity: 0.55;
            }

            50% {
                transform: scale(1.15);
                opacity: 1;
            }

        }



        /* =====================================================
           PASSWORD CARD
        ===================================================== */

        .lock-card {
            position: relative;
            z-index: 5;

            width: min(430px, 100%);

            padding: 44px 34px 36px;

            text-align: center;

            border: 1px solid rgba(255, 217, 194, 0.25);

            border-radius: 28px;

            background:
                linear-gradient(145deg,
                    rgba(56, 12, 29, 0.92),
                    rgba(20, 4, 11, 0.96));

            box-shadow:
                0 35px 90px rgba(0, 0, 0, 0.6),
                0 0 40px rgba(200, 63, 105, 0.1);

            backdrop-filter: blur(18px);
        }



        .lock-small {
            margin: 0 0 10px;

            color: #d7aa99;

            font-size: 11px;

            letter-spacing: 4px;

            text-transform: uppercase;
        }



        .lock-title {
            margin: 0;

            color: #fff1e9;

            font-size: clamp(31px, 7vw, 46px);

            font-weight: 500;

            letter-spacing: 1px;
        }


        .lock-title span {
            color: #d95a7f;

            display: inline-block;

            animation: heartBeat 1.6s ease-in-out infinite;
        }


        @keyframes heartBeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.14);
            }

        }



        .lock-description {
            margin: 13px auto 28px;

            max-width: 300px;

            color: rgba(255, 238, 229, 0.67);

            font-size: 13px;

            line-height: 1.75;
        }



        /* =====================================================
           BARCODE
        ===================================================== */

        .barcode-wrap {
            margin: 0 auto 29px;

            width: 255px;

            max-width: 100%;
        }


        .barcode {
            position: relative;

            width: 100%;
            height: 82px;

            overflow: hidden;

            border-radius: 8px;

            background:
                repeating-linear-gradient(90deg,

                    #f6ded1 0px,
                    #f6ded1 2px,

                    transparent 2px,
                    transparent 5px,

                    #f6ded1 5px,
                    #f6ded1 9px,

                    transparent 9px,
                    transparent 12px,

                    #f6ded1 12px,
                    #f6ded1 13px,

                    transparent 13px,
                    transparent 18px,

                    #f6ded1 18px,
                    #f6ded1 23px,

                    transparent 23px,
                    transparent 26px,

                    #f6ded1 26px,
                    #f6ded1 28px,

                    transparent 28px,
                    transparent 33px);

            opacity: 0.92;

            mask-image:
                linear-gradient(to bottom,
                    transparent,
                    black 7%,
                    black 93%,
                    transparent);
        }


        .barcode::after {
            content: "";

            position: absolute;
            left: 0;
            right: 0;

            height: 2px;

            background: #ff789b;

            box-shadow:
                0 0 9px #ff6b94,
                0 0 20px rgba(255, 80, 130, 0.8);

            animation: barcodeScan 2.6s ease-in-out infinite;
        }


        @keyframes barcodeScan {

            0% {
                top: 6px;
                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            85% {
                opacity: 1;
            }

            100% {
                top: 74px;
                opacity: 0;
            }

        }



        .barcode-text {
            margin-top: 7px;

            color: #b98b7e;

            font-family: monospace;

            font-size: 10px;

            letter-spacing: 4px;
        }



        /* =====================================================
           PASSWORD FORM
        ===================================================== */

        .password-label {
            display: block;

            margin-bottom: 10px;

            color: #ead2c8;

            font-size: 12px;

            letter-spacing: 1.2px;
        }



        .password-box {
            position: relative;

            width: 100%;
        }



        #passwordInput {
            width: 100%;

            padding: 15px 50px 15px 17px;

            border-radius: 14px;

            border: 1px solid rgba(255, 208, 190, 0.23);

            outline: none;

            background: rgba(7, 1, 4, 0.54);

            color: #fff5ef;

            text-align: center;

            font-family: inherit;

            font-size: 16px;

            letter-spacing: 2px;

            transition:
                border 0.25s ease,
                box-shadow 0.25s ease;
        }


        #passwordInput:focus {
            border-color: rgba(233, 106, 143, 0.65);

            box-shadow:
                0 0 0 3px rgba(233, 106, 143, 0.08);
        }



        .show-password {
            position: absolute;

            top: 50%;
            right: 14px;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #cf9c8c;

            cursor: pointer;

            font-size: 15px;
        }



        .unlock-button {
            width: 100%;

            margin-top: 14px;

            padding: 14px 20px;

            border: 1px solid rgba(255, 205, 180, 0.3);

            border-radius: 14px;

            background:
                linear-gradient(135deg,
                    #7a1e3f,
                    #a62e57);

            color: #fff7f2;

            font-family: inherit;

            font-size: 13px;

            letter-spacing: 2px;

            cursor: pointer;

            box-shadow:
                0 10px 27px rgba(90, 5, 36, 0.42);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }


        .unlock-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 32px rgba(115, 9, 47, 0.5);
        }


        .unlock-button:active {
            transform: scale(0.98);
        }



        .password-message {
            min-height: 19px;

            margin: 13px 0 0;

            color: #ff90a9;

            font-size: 12px;

            opacity: 0;

            transition: opacity 0.3s ease;
        }


        .password-message.show {
            opacity: 1;
        }



        .lock-footer {
            margin-top: 22px;

            color: rgba(232, 195, 181, 0.46);

            font-size: 10px;

            letter-spacing: 2px;
        }



        /* =====================================================
           SHAKE WHEN PASSWORD WRONG
        ===================================================== */

        .lock-card.shake {
            animation: wrongPassword 0.42s ease;
        }


        @keyframes wrongPassword {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-8px);
            }

            40% {
                transform: translateX(8px);
            }

            60% {
                transform: translateX(-5px);
            }

            80% {
                transform: translateX(5px);
            }

        }



        /* =====================================================
           SPEAKER BUTTON
        ===================================================== */

        .speaker-control {
            position: fixed;

            right: 18px;
            bottom: 18px;

            z-index: 9999;

            width: 47px;
            height: 47px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 3px;

            padding: 0;

            border: 1px solid rgba(255, 214, 193, 0.25);

            border-radius: 50%;

            background: rgba(37, 7, 18, 0.86);

            color: #fff1eb;

            backdrop-filter: blur(12px);

            box-shadow:
                0 8px 26px rgba(0, 0, 0, 0.38),
                0 0 25px rgba(179, 40, 86, 0.1);

            cursor: pointer;

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.5s ease,
                transform 0.25s ease,
                background 0.25s ease;
        }


        body.unlocked .speaker-control {
            opacity: 1;
            visibility: visible;
        }


        .speaker-control:hover {
            transform: scale(1.07);

            background: rgba(70, 13, 33, 0.94);
        }



        .speaker-icon {
            font-size: 18px;

            transform: translateX(1px);
        }



        /* =====================================================
           SOUND WAVES
        ===================================================== */

        .sound-waves {
            display: flex;
            align-items: center;

            gap: 2px;

            height: 18px;
        }


        .sound-waves i {
            display: block;

            width: 2px;

            border-radius: 5px;

            background: #efa6b9;

            transform-origin: center;

            animation: soundWave 0.8s ease-in-out infinite;
        }


        .sound-waves i:nth-child(1) {
            height: 6px;
            animation-delay: 0s;
        }


        .sound-waves i:nth-child(2) {
            height: 13px;
            animation-delay: 0.16s;
        }


        .sound-waves i:nth-child(3) {
            height: 9px;
            animation-delay: 0.32s;
        }


        @keyframes soundWave {

            0%,
            100% {
                transform: scaleY(0.45);
                opacity: 0.45;
            }

            50% {
                transform: scaleY(1.15);
                opacity: 1;
            }

        }



        /* =====================================================
           MUTED
        ===================================================== */

        .speaker-control.muted .sound-waves i {
            animation: none;

            transform: scaleY(0.3);

            opacity: 0.3;
        }



        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .lock-card {
                padding:
                    38px 23px 30px;

                border-radius: 23px;
            }


            .barcode-wrap {
                width: 220px;
            }


            .speaker-control {
                width: 43px;
                height: 43px;

                right: 13px;
                bottom: 13px;
            }

        }
    </style>

</head>



<body>


    <!-- =====================================================
         PASSWORD PAGE
    ===================================================== -->

    <div class="lock-screen" id="lockScreen">

        <div class="lock-glow"></div>


        <div class="lock-card" id="lockCard">


            <p class="lock-small">
                PRIVATE MEMORY
            </p>


            <h1 class="lock-title">

                Elza

                <span>
                    ♥
                </span>

                Silmy

            </h1>


            <p class="lock-description">

                Ada satu tanggal kecil
                yang menjadi kunci
                untuk membuka cerita ini.

            </p>



            <!-- BARCODE -->

            <div class="barcode-wrap">

                <div class="barcode"></div>

                <div class="barcode-text">
                    OUR • LITTLE • STORY
                </div>

            </div>



            <!-- PASSWORD -->

            <form id="passwordForm">


                <label class="password-label" for="passwordInput">

                    masukkan password

                </label>


                <div class="password-box">

                    <input id="passwordInput" type="password" autocomplete="off" placeholder="••••••••••">


                    <button class="show-password" id="showPassword" type="button" aria-label="Lihat password">

                        ♡

                    </button>

                </div>


                <button class="unlock-button" type="submit">

                    OPEN OUR STORY ♥

                </button>


                <p class="password-message" id="passwordMessage">

                    password belum tepat ♥

                </p>


            </form>


            <p class="lock-footer">
                ONLY FOR US
            </p>


        </div>

    </div>



    <!-- =====================================================
         WEBSITE
    ===================================================== -->

    <iframe id="websiteFrame" src="home.html" title="Elza dan Silmy">
    </iframe>



    <!-- =====================================================
         BACKGROUND MUSIC
    ===================================================== -->

    <audio id="backgroundMusic" src="musik/musikromantis.mp3" preload="auto" loop>
    </audio>



    <!-- =====================================================
         SPEAKER
    ===================================================== -->

    <button class="speaker-control" id="speakerButton" type="button" aria-label="Mute atau unmute musik">

        <span class="speaker-icon" id="speakerIcon">

            🔊

        </span>


        <span class="sound-waves">

            <i></i>
            <i></i>
            <i></i>

        </span>

    </button>



    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>

        /* =====================================================
           ELEMENTS
        ===================================================== */

        const passwordForm =
            document.getElementById("passwordForm");

        const passwordInput =
            document.getElementById("passwordInput");

        const passwordMessage =
            document.getElementById("passwordMessage");

        const lockCard =
            document.getElementById("lockCard");

        const showPassword =
            document.getElementById("showPassword");

        const music =
            document.getElementById("backgroundMusic");

        const speakerButton =
            document.getElementById("speakerButton");

        const speakerIcon =
            document.getElementById("speakerIcon");


        /* =====================================================
           PASSWORD
        ===================================================== */

        const correctPassword =
            "03-03-2026";


        passwordForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const enteredPassword =
                    passwordInput.value.trim();


                if (
                    enteredPassword ===
                    correctPassword
                ) {

                    passwordMessage.classList.remove(
                        "show"
                    );


                    /*
                    Karena tombol password ditekan
                    langsung oleh pengguna,
                    browser mengizinkan musik dimulai.
                    */

                    music.volume = 0.38;

                    music.muted = false;


                    try {

                        await music.play();

                    } catch (error) {

                        console.log(
                            "Browser belum mengizinkan audio."
                        );

                    }


                    document.body.classList.add(
                        "unlocked"
                    );


                } else {


                    passwordMessage.textContent =
                        "password belum tepat ♥";


                    passwordMessage.classList.add(
                        "show"
                    );


                    lockCard.classList.remove(
                        "shake"
                    );


                    void lockCard.offsetWidth;


                    lockCard.classList.add(
                        "shake"
                    );


                    passwordInput.select();

                }

            }
        );



        /* =====================================================
           SHOW / HIDE PASSWORD
        ===================================================== */

        showPassword.addEventListener(
            "click",
            function () {

                if (
                    passwordInput.type ===
                    "password"
                ) {

                    passwordInput.type =
                        "text";

                    showPassword.textContent =
                        "♥";

                } else {

                    passwordInput.type =
                        "password";

                    showPassword.textContent =
                        "♡";

                }

            }
        );



        /* =====================================================
           SPEAKER
           TIDAK MEM-PAUSE LAGU
           HANYA MUTE
        ===================================================== */

        speakerButton.addEventListener(
            "click",
            function () {

                music.muted =
                    !music.muted;


                if (music.muted) {

                    speakerButton.classList.add(
                        "muted"
                    );

                    speakerIcon.textContent =
                        "🔇";

                } else {

                    speakerButton.classList.remove(
                        "muted"
                    );

                    speakerIcon.textContent =
                        "🔊";


                    /*
                    Kalau browser sempat menghentikan
                    musik karena alasan tertentu,
                    coba jalankan lagi tanpa reset waktu.
                    */

                    if (music.paused) {

                        music.play()
                            .catch(() => { });

                    }

                }

            }
        );



        /* =====================================================
           AUDIO ERROR CHECK
        ===================================================== */

        music.addEventListener(
            "error",
            function () {

                console.log(
                    "File musik tidak ditemukan. Cek musik/musikromantis.mp3"
                );

            }
        );


    </script>

</body>

</html>
