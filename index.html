<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elza ♥ Silmy</title>


    <style>
        /* =========================================================
   RESET
========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;

            color: white;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            background:
                #090305;
        }

        button,
        input {
            font-family: inherit;
        }


        /* =========================================================
   ACCESS
========================================================= */

        #accessScreen {
            position: fixed;
            inset: 0;

            z-index: 10000;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 22px;

            overflow-y: auto;

            background:
                radial-gradient(circle at 50% 10%,
                    rgba(255, 72, 140, .18),
                    transparent 30%),

                radial-gradient(circle at 15% 85%,
                    rgba(130, 24, 62, .18),
                    transparent 33%),

                linear-gradient(150deg,
                    #18060c,
                    #0c0307 55%,
                    #050203);

            transition:
                opacity .8s ease,
                visibility .8s ease,
                transform .8s ease;
        }


        #accessScreen.hidden {
            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transform:
                scale(1.025);
        }


        /* background */

        .access-bg {
            position: absolute;

            pointer-events: none;

            color:
                rgba(255, 115, 163, .10);

            animation:
                accessFloat 7s ease-in-out infinite;
        }


        .bg1 {
            left: 8%;
            top: 16%;
        }

        .bg2 {
            right: 9%;
            top: 22%;

            animation-delay:
                1s;
        }

        .bg3 {
            left: 12%;
            bottom: 15%;

            animation-delay:
                2s;
        }

        .bg4 {
            right: 13%;
            bottom: 18%;

            animation-delay:
                3s;
        }


        @keyframes accessFloat {

            50% {
                transform:
                    translateY(-15px) rotate(12deg);

                opacity: .8;
            }

        }


        /* =========================================================
   ACCESS CARD
========================================================= */

        .access-card {
            position: relative;

            width:
                min(450px,
                    100%);

            padding:
                40px 28px 32px;

            text-align: center;

            overflow: hidden;

            border:
                1px solid rgba(255, 207, 220, .14);

            border-radius:
                30px;

            background:
                linear-gradient(145deg,
                    rgba(62, 14, 31, .96),
                    rgba(18, 5, 10, .98));

            box-shadow:
                0 35px 85px rgba(0, 0, 0, .62),

                0 0 58px rgba(255, 64, 131, .06);
        }


        .private-label {
            margin-bottom:
                11px;

            color:
                #cc9aa8;

            font-size:
                9px;

            letter-spacing:
                5px;

            text-transform:
                uppercase;
        }


        .couple-name {
            margin-bottom:
                7px;

            color:
                #fff6f9;

            font-size:
                clamp(30px,
                    7vw,
                    43px);

            font-weight:
                normal;
        }


        .couple-name span {
            display:
                inline-block;

            color:
                #ff719f;

            text-shadow:
                0 0 17px rgba(255, 75, 136, .5);

            animation:
                nameHeart 1.8s ease-in-out infinite;
        }


        @keyframes nameHeart {

            50% {
                transform:
                    scale(1.13);
            }

        }


        .little-story {
            margin-bottom:
                17px;

            color:
                #b98e9a;

            font-size:
                9px;

            letter-spacing:
                4px;

            text-transform:
                uppercase;
        }


        /* =========================================================
   STEP
========================================================= */

        .step {
            display:
                none;
        }


        .step.active {
            display:
                block;

            animation:
                stepIn .7s ease both;
        }


        @keyframes stepIn {

            from {
                opacity: 0;

                transform:
                    translateY(13px) scale(.98);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0) scale(1);
            }

        }


        /* =========================================================
   QR
========================================================= */

        .qr-stage {
            position:
                relative;

            width:
                340px;

            max-width:
                100%;

            height:
                315px;

            margin:
                0 auto;
        }


        .qr-aura {
            position:
                absolute;

            left:
                50%;

            top:
                51%;

            width:
                280px;

            height:
                280px;

            transform:
                translate(-50%, -50%);

            border-radius:
                50%;

            background:
                radial-gradient(circle,
                    rgba(255, 70, 136, .27),
                    rgba(255, 70, 136, .08) 40%,
                    transparent 72%);

            filter:
                blur(24px);

            animation:
                auraPulse 3s ease-in-out infinite;
        }


        @keyframes auraPulse {

            50% {
                transform:
                    translate(-50%, -50%) scale(1.10);

                opacity: 1;
            }

        }


        /* heart */

        .heart-svg {
            position:
                absolute;

            left:
                50%;

            top:
                51%;

            z-index:
                1;

            width:
                280px;

            height:
                255px;

            overflow:
                visible;

            transform:
                translate(-50%, -50%);

            animation:
                heartBreath 3.2s ease-in-out infinite;
        }


        .heart-svg path {
            fill:
                rgba(255, 60, 123, .02);

            stroke:
                rgba(255, 145, 182, .92);

            stroke-width:
                2.4;

            filter:
                drop-shadow(0 0 5px rgba(255, 91, 149, .95)) drop-shadow(0 0 18px rgba(255, 67, 132, .48));
        }


        @keyframes heartBreath {

            50% {
                transform:
                    translate(-50%, -50%) scale(1.03);
            }

        }


        /* =========================================================
   ORBIT
========================================================= */

        .orbit {
            position:
                absolute;

            left:
                50%;

            top:
                51%;

            z-index:
                3;

            border-radius:
                50%;

            pointer-events:
                none;
        }


        .orbit1 {
            width:
                300px;

            height:
                154px;

            margin-left:
                -150px;

            margin-top:
                -77px;

            border:
                1px solid rgba(255, 94, 151, .38);

            animation:
                orbitOne 7s linear infinite;
        }


        .orbit2 {
            width:
                270px;

            height:
                202px;

            margin-left:
                -135px;

            margin-top:
                -101px;

            border:
                1px solid rgba(255, 175, 204, .22);

            animation:
                orbitTwo 10s linear infinite reverse;
        }


        .orbit3 {
            width:
                318px;

            height:
                116px;

            margin-left:
                -159px;

            margin-top:
                -58px;

            border:
                1px solid rgba(255, 125, 170, .17);

            animation:
                orbitThree 13s linear infinite;
        }


        @keyframes orbitOne {

            to {
                transform:
                    rotate(360deg);
            }

        }


        @keyframes orbitTwo {

            to {
                transform:
                    rotate(360deg);
            }

        }


        @keyframes orbitThree {

            to {
                transform:
                    rotate(360deg);
            }

        }


        .orbit-dot {
            position:
                absolute;

            width:
                7px;

            height:
                7px;

            border-radius:
                50%;

            background:
                #ff79a8;

            box-shadow:
                0 0 9px #ff79a8;
        }


        .orbit1 .orbit-dot {
            left:
                -3px;

            top:
                47%;
        }


        .orbit2 .orbit-dot {
            right:
                -3px;

            top:
                43%;
        }


        .orbit3 .orbit-dot {
            left:
                72%;

            top:
                -3px;
        }


        /* =========================================================
   QR BOX
========================================================= */

        .qr-glass {
            position:
                absolute;

            left:
                50%;

            top:
                51%;

            z-index:
                6;

            width:
                186px;

            height:
                186px;

            padding:
                10px;

            overflow:
                hidden;

            transform:
                translate(-50%, -50%);

            border-radius:
                25px;

            background:
                white;

            box-shadow:
                0 16px 38px rgba(0, 0, 0, .30),

                0 0 25px rgba(255, 105, 155, .28);
        }


        .qr-image {
            display:
                block;

            width:
                100%;

            height:
                100%;

            border-radius:
                14px;
        }


        .scan-beam {
            position:
                absolute;

            left:
                10px;

            right:
                10px;

            top:
                0;

            z-index:
                10;

            height:
                42px;

            background:
                linear-gradient(180deg,
                    transparent,
                    rgba(255, 87, 148, .25),
                    transparent);

            filter:
                blur(3px);

            animation:
                scanBeam 2.6s ease-in-out infinite;
        }


        .scan-line {
            position:
                absolute;

            left:
                9px;

            right:
                9px;

            top:
                13px;

            z-index:
                11;

            height:
                3px;

            border-radius:
                100px;

            background:
                linear-gradient(90deg,
                    transparent,
                    #ff568f,
                    white,
                    #ff568f,
                    transparent);

            box-shadow:
                0 0 8px #ff568f,

                0 0 18px rgba(255, 64, 130, .95);

            animation:
                scanLine 2.6s ease-in-out infinite;
        }


        @keyframes scanBeam {

            50% {
                top:
                    142px;
            }

        }


        @keyframes scanLine {

            50% {
                top:
                    169px;
            }

        }


        .qr-title {
            margin-top:
                -6px;

            color:
                #f3cad6;

            font-size:
                10px;

            letter-spacing:
                3px;

            text-transform:
                uppercase;
        }


        .qr-subtitle {
            margin:
                7px 0 21px;

            color:
                rgba(234, 198, 209, .54);

            font-size:
                9px;
        }


        /* =========================================================
   BUTTON
========================================================= */

        .romantic-button {
            width:
                100%;

            padding:
                16px 20px;

            border:
                1px solid rgba(255, 165, 190, .34);

            border-radius:
                50px;

            cursor:
                pointer;

            color:
                #fff5f8;

            font-size:
                10px;

            letter-spacing:
                3px;

            text-transform:
                uppercase;

            background:
                linear-gradient(135deg,
                    #93264a,
                    #5c152d);

            box-shadow:
                0 10px 28px rgba(106, 20, 49, .42);
        }


        /* =========================================================
   PASSWORD
========================================================= */

        .password-stage {
            position:
                relative;

            padding:
                5px 0;
        }


        .password-aura {
            position:
                absolute;

            left:
                50%;

            top:
                70px;

            width:
                190px;

            height:
                190px;

            transform:
                translateX(-50%);

            border-radius:
                50%;

            background:
                rgba(255, 75, 138, .12);

            filter:
                blur(40px);
        }


        .password-heart {
            position:
                relative;

            width:
                64px;

            height:
                64px;

            margin:
                3px auto 19px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border:
                1px solid rgba(255, 126, 167, .20);

            border-radius:
                50%;

            color:
                #ff719f;

            background:
                rgba(255, 111, 159, .10);

            font-size:
                29px;

            animation:
                passHeart 1.9s ease-in-out infinite;
        }


        @keyframes passHeart {

            50% {
                transform:
                    scale(1.08);
            }

        }


        .password-title {
            margin-bottom:
                7px;

            color:
                #fff4f7;

            font-size:
                27px;

            font-weight:
                normal;
        }


        .password-subtitle {
            margin:
                0 auto 24px;

            color:
                #b98d99;

            font-size:
                11px;

            line-height:
                1.75;
        }


        .password-input {
            width:
                100%;

            margin-bottom:
                13px;

            padding:
                16px 20px;

            border:
                1px solid rgba(255, 179, 199, .20);

            border-radius:
                50px;

            outline:
                none;

            color:
                white;

            text-align:
                center;

            font-size:
                14px;

            letter-spacing:
                5px;

            background:
                rgba(255, 255, 255, .035);
        }


        .password-error {
            min-height:
                20px;

            margin-top:
                12px;

            color:
                #ff91ae;

            font-size:
                10px;

            opacity:
                0;
        }


        .password-error.show {
            opacity:
                1;
        }


        .back-button {
            margin-top:
                11px;

            border:
                none;

            cursor:
                pointer;

            color:
                #a77a87;

            font-size:
                9px;

            letter-spacing:
                2px;

            background:
                transparent;
        }


        /* =========================================================
   TYPEWRITER
========================================================= */

        #typewriterScreen {
            position:
                fixed;

            inset:
                0;

            z-index:
                20000;

            display:
                none;

            align-items:
                center;

            justify-content:
                center;

            padding:
                28px;

            opacity:
                0;

            background:
                radial-gradient(circle,
                    rgba(118, 21, 57, .30),
                    transparent 42%),

                #090305;

            transition:
                opacity .85s ease;
        }


        #typewriterScreen.show {
            display:
                flex;

            opacity:
                1;
        }


        #typewriterScreen.fade-out {
            opacity:
                0;
        }


        .typewriter-box {
            position:
                relative;

            width:
                min(760px,
                    100%);

            min-height:
                260px;

            padding:
                60px 42px 45px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border:
                1px solid rgba(255, 185, 207, .15);

            border-radius:
                30px;

            text-align:
                center;

            background:
                rgba(55, 11, 28, .50);
        }


        .typewriter-label {
            position:
                absolute;

            top:
                27px;

            left:
                50%;

            transform:
                translateX(-50%);

            color:
                rgba(255, 183, 205, .52);

            font-size:
                9px;

            letter-spacing:
                5px;
        }


        #typewriterText {
            max-width:
                650px;

            color:
                #fff0f5;

            font-size:
                clamp(19px,
                    3vw,
                    29px);

            line-height:
                1.85;
        }


        .love-final {
            color:
                #ff82aa;

            text-shadow:
                0 0 20px rgba(255, 98, 151, .45);
        }


        .type-cursor {
            color:
                #ff7ba7;

            animation:
                cursorBlink .72s infinite;
        }


        @keyframes cursorBlink {

            50% {
                opacity: 0;
            }

        }


        /* =========================================================
   GIFT SCREEN
========================================================= */

        #giftScreen {
            position:
                fixed;

            inset:
                0;

            z-index:
                21000;

            display:
                none;

            align-items:
                center;

            justify-content:
                center;

            overflow:
                hidden;

            opacity:
                0;

            background:
                radial-gradient(circle,
                    rgba(123, 23, 59, .30),
                    transparent 42%),

                #080204;

            transition:
                opacity .8s ease;
        }


        #giftScreen.show {
            display:
                flex;

            opacity:
                1;
        }


        #giftScreen.fade-out {
            opacity:
                0;
        }


        .gift-stage {
            position:
                relative;

            width:
                min(760px,
                    100%);

            height:
                520px;
        }


        /* =========================================================
   DOVES
========================================================= */

        .dove {
            position:
                absolute;

            top:
                38%;

            z-index:
                5;

            opacity:
                0;

            font-size:
                60px;

            filter:
                drop-shadow(0 0 12px rgba(255, 255, 255, .20));
        }


        .dove-left {
            left:
                -120px;

            transform:
                scaleX(-1);

            animation:
                doveEnterLeft 2.35s ease forwards;
        }


        .dove-right {
            right:
                -120px;

            animation:
                doveEnterRight 2.35s ease forwards;
        }


        @keyframes doveEnterLeft {

            to {
                left:
                    24%;

                opacity:
                    1;
            }

        }


        @keyframes doveEnterRight {

            to {
                right:
                    24%;

                opacity:
                    1;
            }

        }


        .dove-left.roam {
            animation:
                doveRoamLeft 4.2s ease-in-out infinite !important;
        }


        .dove-right.roam {
            animation:
                doveRoamRight 4.2s ease-in-out infinite !important;
        }


        @keyframes doveRoamLeft {

            0% {
                left: 24%;
                top: 38%;
            }

            20% {
                left: 7%;
                top: 16%;
            }

            40% {
                left: 19%;
                top: 55%;
            }

            60% {
                left: 3%;
                top: 39%;
            }

            80% {
                left: 18%;
                top: 12%;
            }

            100% {
                left: 24%;
                top: 38%;
            }

        }


        @keyframes doveRoamRight {

            0% {
                right: 24%;
                top: 38%;
            }

            20% {
                right: 7%;
                top: 17%;
            }

            40% {
                right: 18%;
                top: 56%;
            }

            60% {
                right: 3%;
                top: 39%;
            }

            80% {
                right: 17%;
                top: 13%;
            }

            100% {
                right: 24%;
                top: 38%;
            }

        }


        /* =========================================================
   GIFT
========================================================= */

        .gift-box {
            position:
                absolute;

            left:
                50%;

            top:
                49%;

            z-index:
                6;

            opacity:
                0;

            transform:
                translate(-50%, -50%);

            font-size:
                92px;
        }


        .gift-box.visible {
            opacity:
                1;

            animation:
                giftFloat 1.3s ease-in-out infinite;
        }


        @keyframes giftFloat {

            50% {
                transform:
                    translate(-50%, -57%);
            }

        }


        /* auto click */

        .tap-ring {
            position:
                absolute;

            left:
                50%;

            top:
                49%;

            z-index:
                8;

            width:
                105px;

            height:
                105px;

            border:
                2px solid rgba(255, 158, 191, .86);

            border-radius:
                50%;

            opacity:
                0;

            transform:
                translate(-50%, -50%);
        }


        .tap-ring.play {
            animation:
                tapPulse .55s ease;
        }


        @keyframes tapPulse {

            0% {
                opacity:
                    .95;

                transform:
                    translate(-50%, -50%) scale(.25);
            }

            100% {
                opacity:
                    0;

                transform:
                    translate(-50%, -50%) scale(1.45);
            }

        }


        /* flash */

        .gift-flash {
            position:
                absolute;

            left:
                50%;

            top:
                49%;

            z-index:
                12;

            width:
                20px;

            height:
                20px;

            border-radius:
                50%;

            opacity:
                0;

            transform:
                translate(-50%, -50%);

            background:
                white;

            box-shadow:
                0 0 30px white,
                0 0 90px #ff8bb4,
                0 0 150px #ff5f96;
        }


        .gift-flash.active {
            animation:
                flashOpen .8s ease;
        }


        @keyframes flashOpen {

            40% {
                opacity: 1;

                transform:
                    translate(-50%, -50%) scale(4);
            }

            100% {
                opacity: 0;

                transform:
                    translate(-50%, -50%) scale(9);
            }

        }


        /* =========================================================
   INTRO PHOTO
========================================================= */

        .intro-photo-wrap {
            position:
                absolute;

            left:
                50%;

            top:
                49%;

            z-index:
                11;

            /* LEBIH KECIL */
            width:
                220px;

            height:
                285px;

            padding:
                8px;

            overflow:
                hidden;

            opacity:
                0;

            border-radius:
                25px;

            transform:
                translate(-50%, -50%) scale(.50);

            background:
                linear-gradient(145deg,
                    #fff8fb,
                    #ffe5ee);

            box-shadow:
                0 22px 50px rgba(0, 0, 0, .42),

                0 0 40px rgba(255, 105, 155, .30);
        }


        .intro-photo-wrap.visible {
            animation:
                photoReveal 1.1s ease forwards,

                photoWave 2.5s ease-in-out 1.1s infinite;
        }


        .intro-photo-wrap img {
            width:
                100%;

            height:
                100%;

            display:
                block;

            object-fit:
                cover;

            border-radius:
                18px;
        }


        @keyframes photoReveal {

            to {
                opacity:
                    1;

                transform:
                    translate(-50%, -50%) scale(1);
            }

        }


        @keyframes photoWave {

            0%,
            100% {
                transform:
                    translate(-50%, -50%) translateY(0) rotate(-1deg);
            }

            25% {
                transform:
                    translate(-50%, -50%) translateY(-7px) rotate(1deg);
            }

            50% {
                transform:
                    translate(-50%, -50%) translateY(4px) rotate(-1deg);
            }

            75% {
                transform:
                    translate(-50%, -50%) translateY(-9px) rotate(1.2deg);
            }

        }


        /* =========================================================
   LOVE PARTICLES
========================================================= */

        .flying-heart,
        .flying-love-text {
            position:
                absolute;

            bottom:
                -45px;

            z-index:
                4;

            pointer-events:
                none;

            animation:
                loveFly linear forwards;
        }


        .flying-heart {
            color:
                #ff6f9f;

            text-shadow:
                0 0 10px #ff6f9f,
                0 0 22px rgba(255, 91, 145, .78);
        }


        .flying-love-text {
            color:
                rgba(255, 190, 211, .94);

            font-style:
                italic;

            white-space:
                nowrap;

            text-shadow:
                0 0 10px rgba(255, 94, 148, .7);
        }


        @keyframes loveFly {

            0% {
                opacity:
                    0;

                transform:
                    translateY(0) scale(.65);
            }

            15% {
                opacity:
                    1;
            }

            100% {
                opacity:

        function typingDelay(
            character
        ) {

            if (
                character === "."
            ) {

                return 240;

            }

            if (
                character === ","
            ) {

                return 170;

            }

            if (
                character === "♥"
            ) {

                return 420;

            }

            if (
                character === " "
            ) {

                return 35;

            }

            return 56;

                '<span id="typedContent"></span><span class="type-cursor">|</span>';


            const typedContent =
                document.getElementById(
                    "typedContent"
                );


            let index =
                0;


            function typeNext() {

                if (
                    index <
                    message.length
                ) {

                    const character =
                        message.charAt(
                            index
                        );


                    typedContent.textContent +=
                        character;


                    index++;


                    setTimeout(
                        typeNext,
                        typingDelay(
                            character
                        )
                    );


                    return;

                }


                const loveText =
                    "i love u ♥";


                const full =
                    typedContent.textContent;


                const before =
                    full.slice(
                        0,
                        -loveText.length
                    );

                    before +
                    '<span class="love-final">' +
                    loveText +
                    '</span>';

                    startGiftScene,
                    2100

                    event

                      hentikan home.js lama

                    */

                    event.preventDefault();

                    event.stopImmediatePropagation();


                    if (
                        openButton.dataset.opened ===
                        "1"

                        return;

                    openButton.dataset.opened =
                        "1";


                    const ribbon =
                        doc.getElementById(
                            "ribbon"

                    const coverText =
                        doc.getElementById(
                            "coverText"
                        );


                    const book =
                        doc.getElementById(

                        doc.getElementById(
                            "bookLight"

                    const particles =
                        doc.getElementById(
                            "openingParticles"

                    const status =
                        doc.getElementById(
                            "storyStatus"

                    openButton.classList.add(
                        "hidden"
                    );


                    if (
                        status

                        status.textContent =

                        status.classList.add(
                            "visible"
                        );

                    }


                    /*

                    setTimeout(

                                coverText.classList.add(
                                    "show"
                                );

                            }

                        100

        /* =========================================================
           IFRAME
        ========================================================= */

        siteFrame.addEventListener(
            "load",
            function () {

                try {

                    const doc =
                        siteFrame.contentDocument ||
                        siteFrame.contentWindow.document;


                    const currentFile =
                        siteFrame
                            .contentWindow
                            .location
                            .pathname
                            .split("/")
                            .pop()
                            .toLowerCase();


                    /*
                      HOME
                    */

                    if (
                        currentFile ===
                        "home.html"
                    ) {

                        patchHome(
                            doc
                        );

                    }


                    /*
                      MY PRINCES
                    */

                    if (
                        currentFile ===
                        "cerita.html"
                    ) {

                        patchPrinces(
                            doc
                        );

                    }


                    /*
                      SURAT CINTA
                    */

                    if (
                        currentFile ===
                        "surat.html"
                    ) {

                        patchSurat(
                            doc
                        );

                    }


                    /*
                      SEMUA LINK INTERNAL
                    */

                    const links =
                        doc.querySelectorAll(
                            "a"
                        );


                    links.forEach(
                        function (
                            link
                        ) {

                            link.addEventListener(
                                "click",
                                function (
                                    event
                                ) {

                                    const href =
                                        link.getAttribute(
                                            "href"
                                        );


                                    if (
                                        !href
                                    ) {

                                        return;

                                    }


                                    if (
                                        href.startsWith(
                                            "http"
                                        ) ||

                                        href.startsWith(
                                            "mailto:"
                                        ) ||

                                        href.startsWith(
                                            "tel:"
                                        ) ||

                                        href.startsWith(
                                            "#"
                                        )
                                    ) {

                                        return;

                                    }


                                    event.preventDefault();


                                    loadPage(
                                        href
                                    );

                                }
                            );

                        }
                    );


                    /*
                      EXPLORE HOME
                    */

                    const continueBtn =
                        doc.getElementById(
                            "continueBtn"
                        );


                    if (
                        continueBtn
                    ) {

                        continueBtn.addEventListener(
                            "click",
                            function (
                                event
                            ) {

                                event.preventDefault();


                                loadPage(
                                    "gallery.html"
                                );

                            },
                            true
                        );
